name: LeadAI CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'chore/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-format:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          # pinned: a new release's default rules must not break CI overnight
          pip install ruff==0.16.2 mypy==2.3.1

      - name: Run Ruff Linter
        run: ruff check app tests scripts

      - name: Run Mypy Type Checker
        run: mypy app --ignore-missing-imports --no-strict-optional

  test:
    name: Test Suite (MongoDB & Redis Services)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3

      - name: Run Pytest Suite
        env:
          MONGO_URI: mongodb://localhost:27017/test_leadai
          MONGO_DB_NAME: test_leadai
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_ci_environment_32chars
        run: |
          pytest -v --tb=short

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Dependencies
        run: |
          pip-audit -r requirements.txt || true

  frontend-validation:
    name: Frontend Syntax & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate JavaScript Syntax
        run: |
          # the portals' JavaScript lives in app/static (served at /static)
          find app/static -name "*.js" -print -exec node --check {} +

  deploy:
    name: Deploy to VPS (leadorbit.aifilingdesk.com)
    # only pushes to main of the production repo, and only after every check passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'saurabh95710/LEADAI'
    needs: [lint-and-format, test, frontend-validation]
    runs-on: ubuntu-latest
    # one deploy at a time; a newer push waits rather than racing the running one
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://leadorbit.aifilingdesk.com
    steps:
      - name: Set up SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Pull the tested commit and restart the app
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # deploy exactly the commit CI tested, then run the script from that commit
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "cd ~/leadai && git fetch --quiet origin main && git reset --hard ${GITHUB_SHA} && bash scripts/deploy_vps.sh"
